[project]
name = "titanrag-workspace"
version = "0.1.0"
description = "TitanRAG Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/backend",
    "packages/workers",
    "packages/sdk",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "N805", "E501", "N818", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/backend/tests", "packages/workers/tests", "packages/sdk/tests"]
pythonpath = ["packages/backend", "packages/workers", "packages/sdk"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
