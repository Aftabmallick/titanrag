name: Docker Build & Security Scan

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-scan:
    name: Build Images & Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./packages/backend
            dockerfile: ./packages/backend/Dockerfile
            image: titan-backend
          - name: workers-core
            context: ./packages/workers
            dockerfile: ./packages/workers/Dockerfile.core
            image: titan-workers-core
          - name: workers-heavy
            context: ./packages/workers
            dockerfile: ./packages/workers/Dockerfile.heavy
            image: titan-workers-heavy
          - name: frontend
            context: ./packages/frontend
            dockerfile: ./packages/frontend/Dockerfile
            image: titan-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:test

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}:test
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
