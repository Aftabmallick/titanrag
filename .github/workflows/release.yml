name: TitanRAG Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish Python SDK to PyPI'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish Widget to npm'
        type: boolean
        default: true
      publish_docker:
        description: 'Build & Publish Docker images'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-test:
    name: Run Quality Gates & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Release Originates From Master Branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref_name }}" != "master" ]; then
              echo "::error::Manual release workflow can only be run from the 'master' branch (attempted from '${{ github.ref_name }}')."
              exit 1
            fi
            echo "✅ Manual workflow triggered from master branch."
          elif [ "${{ github.event_name }}" = "push" ]; then
            git fetch origin master
            if ! git merge-base --is-ancestor HEAD origin/master; then
              echo "::error::Release tag '${{ github.ref_name }}' was not created from a commit on 'master'. Only commits on master may be published."
              exit 1
            fi
            echo "✅ Release tag verified as belonging to master branch."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --all-packages

      - name: Run Test Suite
        run: |
          uv run pytest packages/backend/tests/ packages/sdk/tests/ -q

      - name: Run Evaluation CI Quality Gate
        run: |
          uv run python scripts/ci_evaluation_gate.py --dry-run

  publish-pypi:
    name: Publish Python SDK (PyPI)
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Version Already Exists on PyPI
        id: check-pypi
        working-directory: packages/sdk
        run: |
          SDK_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT
          if curl -s -f "https://pypi.org/pypi/titanrag/$SDK_VERSION/json" > /dev/null 2>&1; then
            echo "Version $SDK_VERSION already exists on PyPI. Skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $SDK_VERSION is new. Proceeding to publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check-pypi.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build Python Package
        if: steps.check-pypi.outputs.skip != 'true'
        working-directory: packages/sdk
        run: |
          uv build --out-dir dist

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.skip != 'true'
        working-directory: packages/sdk
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/*

  publish-npm:
    name: Publish Widget (npm)
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Check if Version Already Exists on npm
        id: check-npm
        working-directory: packages/widget
        run: |
          WIDGET_VERSION=$(node -p "require('./package.json').version")
          echo "widget_version=$WIDGET_VERSION" >> $GITHUB_OUTPUT
          if npm view @titanrag/widget@$WIDGET_VERSION version > /dev/null 2>&1; then
            echo "Version $WIDGET_VERSION already exists on npm. Skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $WIDGET_VERSION is new. Proceeding to publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & Test Widget
        if: steps.check-npm.outputs.skip != 'true'
        working-directory: packages/widget
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish to npm
        if: steps.check-npm.outputs.skip != 'true'
        working-directory: packages/widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  build-and-publish-docker:
    name: Build & Publish Container Images
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_docker == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/titan-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Titan API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-github-release:
    name: Publish GitHub Release
    needs: validate-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TitanRAG ${{ github.ref_name }} — Enterprise GA
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
