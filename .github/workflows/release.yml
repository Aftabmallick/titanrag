name: TitanRAG Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish Python SDK to PyPI'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish Widget to npm'
        type: boolean
        default: true
      publish_docker:
        description: 'Build & Publish Docker images'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-test:
    name: Run Quality Gates & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --all-packages

      - name: Run Test Suite
        run: |
          uv run pytest packages/backend/tests/ packages/sdk/tests/ -q

      - name: Run Evaluation CI Quality Gate
        run: |
          uv run python scripts/ci_evaluation_gate.py --dry-run

  publish-pypi:
    name: Publish Python SDK (PyPI)
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build Python Package
        working-directory: packages/sdk
        run: |
          uv build --out-dir dist

      - name: Publish to PyPI
        working-directory: packages/sdk
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/*

  publish-npm:
    name: Publish Widget (npm)
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Test Widget
        working-directory: packages/widget
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish to npm
        working-directory: packages/widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  build-and-publish-docker:
    name: Build & Publish Container Images
    needs: validate-and-test
    if: github.event_name == 'push' || inputs.publish_docker == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/titan-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Titan API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-github-release:
    name: Publish GitHub Release
    needs: [publish-pypi, publish-npm, build-and-publish-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TitanRAG ${{ github.ref_name }} — Enterprise GA
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
