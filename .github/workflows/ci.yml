name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ./titanrag
        run: |
          uv sync --all-packages

      - name: Ruff Lint & Format Check
        working-directory: ./titanrag
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Static Type Checking
        working-directory: ./titanrag
        run: |
          uv run mypy packages/backend/src packages/workers/src

  integration-test:
    name: Integration & Migration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
          POSTGRES_DB: titanrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: ./titanrag
        run: |
          uv sync --all-packages

      - name: Run Alembic Migrations Up & Down
        working-directory: ./titanrag/packages/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password@localhost:5432/titanrag
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: ./titanrag
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password@localhost:5432/titanrag
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: |
          uv run pytest -v
