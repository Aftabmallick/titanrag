name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-packages

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Static Type Checking
        run: |
          uv run mypy packages/backend/titan_backend packages/workers/titan_workers packages/sdk/titanrag

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/frontend/package-lock.json

      - name: OpenAPI Contract Validation & Breaking Changes Check
        run: |
          uv run python scripts/verify_openapi_contract.py
          uv run python scripts/openapi_changelog.py --strict

      - name: Frontend Tests & Build Check
        working-directory: packages/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Widget Build Check
        working-directory: packages/widget
        run: |
          npm ci
          npm run build

  integration-test:
    name: Integration & Migration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
          POSTGRES_DB: titanrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d titanrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --all-packages

      - name: Run Alembic Migrations Up & Down
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password@localhost:5432/titanrag
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password@localhost:5432/titanrag
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: |
          uv run pytest -v
