[project]
name = "titan-mcp"
version = "0.1.0"
description = "Official Model Context Protocol (MCP) Server for TitanRAG Enterprise Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "titanrag",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
titan-mcp = "titan_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_mcp"]
