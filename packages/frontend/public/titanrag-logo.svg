<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="titanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Subtle Accent -->
  <rect width="800" height="200" rx="16" fill="transparent" />

  <!-- Shield / Vector Emblem -->
  <g transform="translate(40, 20)">
    <!-- Outer Shield Halo -->
    <path d="M 80 10 L 140 35 L 140 95 C 140 135 80 160 80 160 C 80 160 20 135 20 95 L 20 35 Z" 
          fill="url(#shieldGrad)" stroke="url(#titanGrad)" stroke-width="3" filter="url(#glow)" opacity="0.3"/>

    <!-- Inner Core Shield -->
    <path d="M 80 18 L 132 40 L 132 92 C 132 128 80 150 80 150 C 80 150 28 128 28 92 L 28 40 Z" 
          fill="#0B0F19" stroke="url(#titanGrad)" stroke-width="3" />

    <!-- Neural / Vector Projection Nodes -->
    <g stroke="url(#titanGrad)" stroke-width="2" stroke-linecap="round">
      <line x1="80" y1="45" x2="52" y2="78" />
      <line x1="80" y1="45" x2="108" y2="78" />
      <line x1="52" y1="78" x2="80" y2="115" />
      <line x1="108" y1="78" x2="80" y2="115" />
      <line x1="80" y1="45" x2="80" y2="115" />
      <line x1="52" y1="78" x2="108" y2="78" />
    </g>

    <circle cx="80" cy="45" r="5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="52" cy="78" r="4.5" fill="#818CF8" />
    <circle cx="108" cy="78" r="4.5" fill="#818CF8" />
    <circle cx="80" cy="115" r="5.5" fill="#06B6D4" filter="url(#glow)" />
    <circle cx="80" cy="78" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="230" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    TITAN<tspan fill="url(#titanGrad)">RAG</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="234" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#94A3B8">
    SOVEREIGN MULTIMODAL RAG &amp; LLMOPS ENGINE
  </text>

  <!-- Enterprise Pill Badge -->
  <g transform="translate(620, 58)">
    <rect width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="14" r="4" fill="#10B981" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#E2E8F0">
      ENTERPRISE
    </text>
  </g>
</svg>
