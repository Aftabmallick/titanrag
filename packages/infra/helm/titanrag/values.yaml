global:
  environment: production
  domain: titanrag.enterprise

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/titanrag/titan-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10

workers:
  core:
    replicaCount: 4
    image:
      repository: ghcr.io/titanrag/titan-workers-core
      tag: v1.0.0
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  heavyMl:
    replicaCount: 2
    image:
      repository: ghcr.io/titanrag/titan-workers-heavy
      tag: v1.0.0
    resources:
      requests:
        cpu: "2000m"
        memory: "4Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: api.titanrag.enterprise
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: titanrag-api-tls
      hosts:
        - api.titanrag.enterprise

config:
  postgresHost: "titan-postgres.database.svc.cluster.local"
  postgresPort: 5432
  postgresDb: "titanrag"
  redisHost: "titan-redis.cache.svc.cluster.local"
  redisPort: 6379
  qdrantHost: "titan-qdrant.vector.svc.cluster.local"
  qdrantPort: 6333
  minioEndpoint: "titan-minio.storage.svc.cluster.local:9000"
  clamavHost: "titan-clamav.security.svc.cluster.local"
  clamavPort: 3310
