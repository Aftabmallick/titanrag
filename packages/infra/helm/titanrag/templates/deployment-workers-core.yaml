apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-workers-core
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: workers-core
spec:
  replicas: {{ .Values.workers.core.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: workers-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: workers-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: celery-core
          image: "{{ .Values.workers.core.image.repository }}:{{ .Values.workers.core.image.tag }}"
          command: ["celery", "-A", "titan_workers.celery_app", "worker", "-l", "info", "-Q", "p0_interactive,p1_default,p2_bulk_sync", "--prefetch-multiplier=1", "--max-memory-per-child=1048576"]
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.config.postgresHost | quote }}
            - name: REDIS_HOST
              value: {{ .Values.config.redisHost | quote }}
            - name: QDRANT_HOST
              value: {{ .Values.config.qdrantHost | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.config.minioEndpoint | quote }}
          resources:
            {{- toYaml .Values.workers.core.resources | nindent 12 }}
