apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  QDRANT_HOST: {{ .Values.config.qdrantHost | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  CLAMAV_HOST: {{ .Values.config.clamavHost | quote }}
