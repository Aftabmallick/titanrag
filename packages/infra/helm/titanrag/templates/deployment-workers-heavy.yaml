apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-workers-heavy
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: workers-heavy
spec:
  replicas: {{ .Values.workers.heavyMl.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: workers-heavy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: workers-heavy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: celery-heavy
          image: "{{ .Values.workers.heavyMl.image.repository }}:{{ .Values.workers.heavyMl.image.tag }}"
          command: ["celery", "-A", "titan_workers.celery_app", "worker", "-l", "info", "-Q", "heavy_ml,reranking", "--prefetch-multiplier=1", "--max-memory-per-child=2097152"]
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.config.postgresHost | quote }}
            - name: REDIS_HOST
              value: {{ .Values.config.redisHost | quote }}
            - name: QDRANT_HOST
              value: {{ .Values.config.qdrantHost | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.config.minioEndpoint | quote }}
          resources:
            {{- toYaml .Values.workers.heavyMl.resources | nindent 12 }}
