# TitanRAG — Phase 10 Custom Domains & White-Label Proxy Configuration
# Maps custom CNAME domains to tenant context with automatic SSL termination

# Upstream definitions
upstream titan_api_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream titan_frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirection for custom domains
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<custom_host>.+)$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block for custom tenant white-label domains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<custom_host>.+)$;

    # Dynamic or wildcard SSL certificate resolution
    ssl_certificate /etc/letsencrypt/live/custom_domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/custom_domains/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Proxy with Tenant Domain Header Injection
    location /api/ {
        proxy_pass http://titan_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phase 10 White-Label Domain Routing Header
        proxy_set_header X-Tenant-Custom-Domain $custom_host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend Proxy with CSS Variable & Brand Injection
    location / {
        proxy_pass http://titan_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject tenant custom domain for Next.js SSR middleware
        proxy_set_header X-Tenant-Custom-Domain $custom_host;
    }
}
