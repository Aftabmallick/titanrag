name: titanrag

networks:
  titan-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  qdrant-data:
  minio-data:
  grafana-data:
  neo4j-data:

services:
  # ---------------------------------------------------------------------------
  # Core Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-titanrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    networks:
      - titan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-titanrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.0
    container_name: titan-pgbouncer
    restart: unless-stopped
    profiles: ["default", "full"]
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-titanrag}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: md5
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  redis:
    image: redis:7-alpine
    container_name: titan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - titan-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: titan-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - titan-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: titan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - titan-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: titan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - titan-net

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.44.20
    container_name: titan-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-titanrag-litellm-master-key}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-deepseek-ai/deepseek-v4-flash-0731}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - titan-net

  neo4j:
    image: neo4j:5.23-community
    container_name: titan-neo4j
    restart: unless-stopped
    profiles: ["graph", "default", "full"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/titan_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - titan-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ---------------------------------------------------------------------------
  # Application Core Services
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: titan-backend
    restart: unless-stopped
    profiles: ["quickstart", "default", "full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - titan-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  celery-core:
    build:
      context: ../workers
      dockerfile: Dockerfile.core
    container_name: titan-celery-core
    restart: unless-stopped
    profiles: ["default", "full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    command: ["celery", "-A", "titan_workers.celery_app.celery_app", "worker", "-l", "info", "-Q", "p0_interactive,p1_default,p2_bulk_sync", "--max-memory-per-child=1048576", "--prefetch-multiplier=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - titan-net

  outbox-relay:
    build:
      context: ../workers
      dockerfile: Dockerfile.core
    container_name: titan-outbox-relay
    restart: unless-stopped
    profiles: ["default", "full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    command: ["python", "-m", "titan_workers.outbox.relay"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - titan-net

  celery-beat:
    build:
      context: ../workers
      dockerfile: Dockerfile.core
    container_name: titan-celery-beat
    restart: unless-stopped
    profiles: ["default", "full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["celery", "-A", "titan_workers.celery_app.celery_app", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - titan-net

  celery-heavy-ml:
    build:
      context: ../workers
      dockerfile: Dockerfile.heavy
    container_name: titan-celery-heavy-ml
    restart: unless-stopped
    profiles: ["full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    command: ["celery", "-A", "titan_workers.celery_app.celery_app", "worker", "-l", "info", "-Q", "heavy_ml,reranking", "--concurrency=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - titan-net

  celery-media:
    build:
      context: ../workers
      dockerfile: Dockerfile.core
    container_name: titan-celery-media
    restart: unless-stopped
    profiles: ["media", "full"]
    env_file:
      - ../../.env.defaults
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    command: ["celery", "-A", "titan_workers.celery_app.celery_app", "worker", "-l", "info", "-Q", "media_transcription", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - titan-net

  flower:
    image: mher/flower:2.0
    container_name: titan-flower
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - titan-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: titan-frontend
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "3001:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - titan-net

  langfuse:
    image: langfuse/langfuse:2
    container_name: titan-langfuse
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${SECRET_KEY:-titanrag-dev-secret-key-must-be-changed-in-production-min32chars!}
      SALT: ${SECRET_KEY:-titanrag-dev-secret-key-must-be-changed-in-production-min32chars!}
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: http://localhost:3002
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: titan-phoenix
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "6006:6006"
    environment:
      PHOENIX_ENABLE_PROMETHEUS: "true"
    networks:
      - titan-net

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: titan-clamav
    restart: unless-stopped
    profiles: ["security", "full"]
    ports:
      - "3310:3310"
    networks:
      - titan-net

  # ---------------------------------------------------------------------------
  # Observability Stack
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: titan-prometheus
    restart: unless-stopped
    profiles: ["observability", "full"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - titan-net

  grafana:
    image: grafana/grafana:11.1.3
    container_name: titan-grafana
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - titan-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: titan-jaeger
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - titan-net

  # ---------------------------------------------------------------------------
  # Self-Hosted Embedding Acceleration (TEI)
  # ---------------------------------------------------------------------------
  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: titan-tei
    restart: unless-stopped
    profiles: ["embeddings", "full"]
    ports:
      - "8081:80"
    command: ["--model-id", "BAAI/bge-large-en-v1.5", "--port", "80"]
    networks:
      - titan-net

