apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Trace ID derivation to correlate with Jaeger / OpenTelemetry traces
        - datasourceUid: tempo
          matcherRegex: "trace_id=([0-9a-fA-F]+)"
          name: TraceID
          url: "$${__value.raw}"
        # Request ID linking
        - datasourceUid: loki
          matcherRegex: "request_id=([a-zA-Z0-9_-]+)"
          name: RequestID
          url: "$${__value.raw}"
