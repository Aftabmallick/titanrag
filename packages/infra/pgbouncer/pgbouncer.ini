;; PgBouncer Configuration for TitanRAG Enterprise
;; Enforces strict transaction pooling mode with session state safety for PostgreSQL Row-Level Security (RLS)

[databases]
titanrag = host=postgres port=5432 dbname=titanrag auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = *
listen_port = 5432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling allows high-concurrency client multiplexing
;; Every transaction executes within its own clean connection slice
pool_mode = transaction

;; Connection limits
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5.0
max_db_connections = 100

;; Timeouts
server_reset_query = DISCARD ALL
server_check_delay = 10.0
server_check_query = select 1
server_lifetime = 3600.0
server_idle_timeout = 600.0
client_idle_timeout = 0.0
client_login_timeout = 15.0

;; Session parameters allowed to be tracked or set per transaction
;; app.tenant_id must be SET LOCAL within explicit transaction blocks
track_extra_parameters = IntervalStyle, application_name, timezone
ignore_startup_parameters = extra_float_digits, search_path
