[project]
name = "titan-workers"
version = "0.1.0"
description = "TitanRAG Asynchronous Task Workers & Outbox Relay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.0.8",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.11.0",
    "structlog>=24.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-celery>=0.47b0",
    "minio>=7.2.7",
    "httpx>=0.27.0",
    "tiktoken>=0.14.0",
    "datasketch>=2.0.0",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_workers"]
