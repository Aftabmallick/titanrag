[project]
name = "titanrag"
version = "0.1.0"
description = "Official Python SDK & CLI for TitanRAG Enterprise Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.scripts]
titanrag = "titanrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titanrag"]
