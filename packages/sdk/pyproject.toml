[project]
name = "titanrag"
version = "0.1.1"
description = "Official Python SDK & CLI for TitanRAG Enterprise Platform"
readme = "README.md"
license = { text = "BSL-1.1" }
authors = [
    { name = "Aftab Mallick", email = "aftabmallick000@gmail.com" },
]
keywords = ["rag", "ai", "llm", "search", "titanrag", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/Aftabmallick/titanrag"
Documentation = "https://github.com/Aftabmallick/titanrag#readme"
Repository = "https://github.com/Aftabmallick/titanrag"
Issues = "https://github.com/Aftabmallick/titanrag/issues"

[project.scripts]
titan = "titanrag.cli.main:app"
titanrag = "titanrag.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titanrag"]
